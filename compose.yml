
services:

  scaife-redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - sv-redis-data:/data

  new-atlas:
    build: ./new-atlas/server
    command: "gunicorn --bind :8082 --workers 3 atlas.wsgi"
    env_file: new-atlas.env
    ports:
      - ${NEW_ATLAS_PORT:-8082}:8082
    restart: always

  scaife-pgbouncer:
    image: edoburu/pgbouncer
    environment:
      AUTH_TYPE: scram-sha-256
      DB_HOST: scaife-postgres
      DB_USER: ${POSTGRES_USER:-scaife}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-scaife}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    depends_on:
      scaife-postgres:
        condition: service_healthy
    restart: always

  scaife-viewer:
    build:
      context: ./scaife-viewer
      dockerfile: Dockerfile
      target: search-index
    command: "gunicorn --preload --workers 5 sv_pdl.wsgi"
    depends_on:
      scaife-pgbouncer:
        condition: service_started
      scaife-elasticsearch:
        condition: service_healthy
      scaife-redis:
        condition: service_started
    entrypoint: deploy/entrypoint.sh
    env_file: .env
    environment:
      REDIS_URL: redis://scaife-redis:6379/1
    ports:
      - ${SCAIFE_VIEWER_PORT:-8000}:8000
    restart: always
    volumes:
      - sv-atlas-data:/opt/scaife-viewer/src/atlas_data
      - sv-cts-data:/opt/scaife-viewer/src/data/cts

  scaife-postgres:
    image: postgres:18.3-alpine
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-scaife}
      USE_ELASTICSEARCH_SERVICE: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: always
    volumes:
      - sv-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-scaife-viewer-db.sql:/docker-entrypoint-initdb.d/init-scaife-viewer-db.sql:z

  scaife-elasticsearch:
    build:
      context: ./scaife-viewer
      dockerfile: Dockerfile-elasticsearch
    environment:
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - sv-elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  sv-postgres-data:
  sv-elasticsearch-data:
  sv-atlas-data:
  sv-cts-data:
  sv-redis-data:
