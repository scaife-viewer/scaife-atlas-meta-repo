name: Build and Push Images

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push scaife-viewer
        uses: docker/build-push-action@v5
        with:
          context: ./scaife-viewer
          file: ./scaife-viewer/Dockerfile
          target: search-index
          push: true
          tags: |
            ghcr.io/scaife-viewer/scaife-atlas-meta-repo/scaife-viewer:latest
            ghcr.io/scaife-viewer/scaife-atlas-meta-repo/scaife-viewer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push scaife-elasticsearch
        uses: docker/build-push-action@v5
        with:
          context: ./scaife-viewer
          file: ./scaife-viewer/Dockerfile-elasticsearch
          push: true
          tags: |
            ghcr.io/scaife-viewer/scaife-atlas-meta-repo/scaife-elasticsearch:latest
            ghcr.io/scaife-viewer/scaife-atlas-meta-repo/scaife-elasticsearch:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push new-atlas
        uses: docker/build-push-action@v5
        with:
          context: ./new-atlas/server
          push: true
          tags: |
            ghcr.io/scaife-viewer/scaife-atlas-meta-repo/new-atlas:latest
            ghcr.io/scaife-viewer/scaife-atlas-meta-repo/new-atlas:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
